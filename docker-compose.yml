name: diskuk

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgis:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgis
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./services/storage/postgis/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [diskuk_net]

  minio:
    build:
      context: .
      dockerfile: docker/Dockerfile.minio
    restart: always
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./services/storage/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [diskuk_net]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    logging: *default-logging
    environment:
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_DATABASE}
      POOL_MODE: session
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [diskuk_net]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [diskuk_net]

  minioclient:
    build:
      context: .
      dockerfile: docker/Dockerfile.minioclient
    restart: on-failure
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${MINIO_BUCKET}
      DIRECTUS_STORAGE_ACCESS_KEY: ${DIRECTUS_STORAGE_ACCESS_KEY}
      DIRECTUS_STORAGE_SECRET_KEY: ${DIRECTUS_STORAGE_SECRET_KEY}
      ANALYTICS_EXPORT_ACCESS_KEY: ${ANALYTICS_EXPORT_ACCESS_KEY}
      ANALYTICS_EXPORT_SECRET_KEY: ${ANALYTICS_EXPORT_SECRET_KEY}
      ANALYTICS_EXPORT_BUCKET: ${ANALYTICS_EXPORT_BUCKET}
    networks: [diskuk_net]

  directus:
    build:
      context: .
      dockerfile: docker/Dockerfile.directus
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - analytics_exports:/var/lib/directus/analytics-exports
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
      minioclient:
        condition: service_completed_successfully
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Directus defaults plus the partitioned analytics read model, which cannot have the
      # single-column primary key Directus requires (see migration 20260926B).
      DB_EXCLUDE_TABLES: spatial_ref_sys,sysdiagrams,analitik_usaha_current
      STORAGE_LOCATIONS: s3
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${DIRECTUS_STORAGE_ACCESS_KEY}
      STORAGE_S3_SECRET: ${DIRECTUS_STORAGE_SECRET_KEY}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_REGION: ap-southeast-1
      WEBSOCKETS_ENABLED: "false"
      ACCESS_TOKEN_TTL: 15m
      SESSION_COOKIE_TTL: 8h
      REFRESH_TOKEN_TTL: 9h
      SESSION_COOKIE_SAME_SITE: lax
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_NAME: ${DIRECTUS_SESSION_COOKIE_NAME:-diskuk_session}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-https://diskuk.tangkassiskamling.com}
      ANALYTICS_EXPORT_DIR: ${ANALYTICS_EXPORT_DIR:-/var/lib/directus/analytics-exports}
      ANALYTICS_REDIS_URL: ${ANALYTICS_REDIS_URL:-redis://redis:6379/0}
      ANALYTICS_REDIS_TTL_SECONDS: ${ANALYTICS_REDIS_TTL_SECONDS:-300}
      # Authentication: ALTCHA captcha on every local login + password reset.
      AUTH_CAPTCHA_ENFORCE: ${AUTH_CAPTCHA_ENFORCE:-true}
      AUTH_CAPTCHA_COST: ${AUTH_CAPTCHA_COST:-5000}
      # Origins that may log in without a captcha (the Data Studio). "none" here because the web
      # and Directus share an origin behind Caddy, so exempting it would disable the web captcha.
      AUTH_CAPTCHA_EXEMPT_ORIGINS: ${AUTH_CAPTCHA_EXEMPT_ORIGINS:-none}
      # ADR-001 session policy: sign out after this long without requests / this long after login.
      AUTH_SESSION_IDLE_TIMEOUT: ${AUTH_SESSION_IDLE_TIMEOUT:-30m}
      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE:-8h}
      # CSRF (ADR-001 #9): origins whose pages may change data with the session cookie.
      # Empty = PUBLIC_URL's origin, which is also the web's origin behind Caddy.
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      ALTCHA_HMAC_SECRET: ${ALTCHA_HMAC_SECRET:-}
      # ADR-006: the public catalogue reads through the Directus Public policy, so every route is
      # limited per client IP. Caddy sets X-Forwarded-For and the web's /panel proxy passes it on.
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      RATE_LIMITER_STORE: memory
      RATE_LIMITER_POINTS: ${RATE_LIMITER_POINTS:-100}
      RATE_LIMITER_DURATION: ${RATE_LIMITER_DURATION:-1}
      AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-}
      PASSWORD_RESET_URL_ALLOW_LIST: ${AUTH_PASSWORD_RESET_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@diskuk.jabarprov.go.id}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-sendmail}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}
    networks: [diskuk_net]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Directus address baked into the /panel/** route rule at build time.
        PANEL_URL: ${PANEL_URL:-http://directus:8055}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - directus
    environment:
      ANALYTICS_ENABLE_WORKFORCE: ${ANALYTICS_ENABLE_WORKFORCE:-false}
    networks: [diskuk_net]

  analytics-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics-worker
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 2m
    depends_on:
      directus:
        condition: service_started
    volumes:
      - analytics_exports:/var/lib/directus/analytics-exports
    environment:
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgres://${DB_USER}:${DB_PASSWORD}@postgis:5432/${DB_DATABASE}}
      ANALYTICS_WORKER_POLL_MS: ${ANALYTICS_WORKER_POLL_MS:-1000}
      ANALYTICS_WORKER_CONCURRENCY: ${ANALYTICS_WORKER_CONCURRENCY:-2}
      ANALYTICS_WORKER_LEASE_SECONDS: ${ANALYTICS_WORKER_LEASE_SECONDS:-120}
      ANALYTICS_EXPORT_DIR: ${ANALYTICS_EXPORT_DIR:-/var/lib/directus/analytics-exports}
      ANALYTICS_EXPORT_ACCESS_KEY: ${ANALYTICS_EXPORT_ACCESS_KEY}
      ANALYTICS_EXPORT_SECRET_KEY: ${ANALYTICS_EXPORT_SECRET_KEY}
      ANALYTICS_EXPORT_BUCKET: ${ANALYTICS_EXPORT_BUCKET}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks: [diskuk_net]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/caddy/data:/data
      - ./services/caddy/config:/config
    environment:
      # Dipakai Caddyfile (rewrite /tiles/*) untuk menamai bucket arsip PMTiles.
      ANALYTICS_EXPORT_BUCKET: ${ANALYTICS_EXPORT_BUCKET}
    depends_on:
      - web
    networks: [diskuk_net]

volumes:
  analytics_exports:

networks:
  diskuk_net:
    name: diskuk_net
