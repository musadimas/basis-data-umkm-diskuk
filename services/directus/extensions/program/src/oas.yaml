openapi: 3.0.3
info:
  title: Program UMKM API (Brief Fitur)
  version: "1.0.0"
  description: Programme modules (Talent Scouting, KPI Mingguan, Katalog, Talent Passport, Klinik, Kegiatan). Authenticated unless marked public. Owner NIK is always masked.
servers:
  - url: /panel/v1/program
security:
  - Session: []
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: diskuk_session
  parameters:
    UsahaId: { in: path, name: usahaId, required: true, schema: { type: string, format: uuid } }
    Id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
paths:
  /talent/usaha/{usahaId}: { get: { tags: [Talent Scouting], parameters: [{ $ref: "#/components/parameters/UsahaId" }], responses: { "200": { description: SIDT summary with masked NIK, certificates and latest submission } } } }
  /talent/pengajuan:
    get: { tags: [Talent Scouting], parameters: [{ in: query, name: status, schema: { type: string, enum: [draft, dinilai, disetujui, ditolak] } }], responses: { "200": { description: Submissions, best score first } } }
    post: { tags: [Talent Scouting], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [usaha] } } } }, responses: { "201": { description: Draft submission }, "409": { description: PENGAJUAN_SUDAH_ADA } } }
  /talent/pengajuan/{id}: { patch: { tags: [Talent Scouting], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Updated draft; previous score cleared }, "409": { description: PENGAJUAN_CLOSED } } } }
  /talent/pengajuan/{id}/hitung-skor: { post: { tags: [Talent Scouting], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Scored submission (placeholder rubric until the official one arrives) } } } }
  /talent/pengajuan/{id}/tolak: { post: { tags: [Talent Scouting], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Rejected submission } } } }
  /talent/berita-acara:
    get: { tags: [Talent Scouting], responses: { "200": { description: Issued Berita Acara } } }
    post: { tags: [Talent Scouting], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pengajuan], properties: { pengajuan: { type: array, maxItems: 200, items: { type: string, format: uuid } }, catatan: { type: string } } } } } }, responses: { "201": { description: Berita Acara issued; businesses moved to talent_pool }, "409": { description: PENGAJUAN_BELUM_DINILAI } } }
  /kpi/peserta: { get: { tags: [KPI Mingguan], responses: { "200": { description: Active participants visible to the caller (scoped by app_role) with this week's report status } } } }
  /kpi/peserta/{id}: { get: { tags: [KPI Mingguan], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Participant, weekly reports and pitching streak }, "404": { description: Not found or not visible } } } }
  /kpi/peserta/{id}/laporan: { post: { tags: [KPI Mingguan], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mingguKe, realisasiOmzet, jumlahTransaksi, clientUuid], properties: { mingguKe: { type: integer }, realisasiOmzet: { type: integer }, jumlahTransaksi: { type: integer }, kendala: { type: string }, bukti: { type: array, maxItems: 5, items: { type: string, format: uuid } }, clientUuid: { type: string, format: uuid }, dibuatPada: { type: string, format: date-time, description: "Device time of an offline draft; must be a Friday (Asia/Jakarta), not ahead of the server by more than 5 minutes, at most 7 days old" } } } } } }, responses: { "201": { description: Report stored }, "200": { description: Same clientUuid already stored (idempotent), or a rejected report corrected }, "400": { description: MINGGU_TIDAK_VALID or DIBUAT_PADA_TIDAK_VALID }, "409": { description: "LAPORAN_SUDAH_ADA, or BUKAN_HARI_LAPOR when a new report is not made on Friday (Asia/Jakarta)" } } } }
  /kpi/peserta/{id}/pitching: { patch: { tags: [KPI Mingguan], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Updated participant }, "409": { description: PITCHING_BELUM_MEMENUHI (needs 4 consecutive approved weeks on target) } } } }
  /kpi/laporan: { get: { tags: [KPI Mingguan], parameters: [{ in: query, name: status, schema: { type: string, enum: [menunggu, disetujui, ditolak] } }], responses: { "200": { description: Review queue } } } }
  /kpi/laporan/{id}/review: { post: { tags: [KPI Mingguan], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [keputusan], properties: { keputusan: { type: string, enum: [disetujui, ditolak] }, catatan: { type: string } } } } } }, responses: { "200": { description: Reviewed report }, "400": { description: CATATAN_WAJIB when rejecting without a note }, "409": { description: LAPORAN_SUDAH_DIREVIEW } } } }
  /katalog/usaha: { get: { tags: [Katalog], parameters: [{ in: query, name: q, schema: { type: string, minLength: 3 } }], responses: { "200": { description: Businesses the caller may manage (curators search by name or NIB) } } } }
  /katalog/produk:
    get: { tags: [Katalog], parameters: [{ in: query, name: usaha, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Products of one business, any curation status } } }
    post: { tags: [Katalog], responses: { "201": { description: Product created; waits for curation }, "400": { description: FOTO_TIDAK_VALID when photos are not in the public catalogue folder } } }
  /katalog/produk/{id}: { patch: { tags: [Katalog], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Product updated and sent back to curation } } } }
  /katalog/kurasi: { get: { tags: [Katalog], parameters: [{ in: query, name: status, schema: { type: string, enum: [menunggu, tayang, rekomendasi_marketplace, ditolak] } }], responses: { "200": { description: Curation queue (province/admin) } } } }
  /katalog/produk/{id}/kurasi: { post: { tags: [Katalog], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Decision stored }, "400": { description: CATATAN_WAJIB when rejecting without a note } } } }
  /katalog/foto/{fileId}: { get: { tags: [Katalog], parameters: [{ in: path, name: fileId, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Photo bytes for the curator or the owning business }, "403": { description: Another owner's photo } } } }
  /katalog/produk/{id}/pdf: { get: { tags: [Katalog], security: [], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Spec sheet PDF of a published product (no owner contact) }, "404": { description: Product not published } } } }
  /katalog/loi:
    get: { tags: [Katalog], responses: { "200": { description: Letters of intent (province/admin, or the owner's own products) }, "403": { description: Neither curator nor owner } } }
    post: { tags: [Katalog], security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [produk, nama, email, pesan, captcha, clientUuid, persetujuanKontak] } } } }, responses: { "201": { description: Letter of intent stored }, "200": { description: Duplicate submission; the stored letter is returned unchanged }, "400": { description: CAPTCHA_INVALID, PERSETUJUAN_WAJIB or invalid input }, "404": { description: Product not published }, "429": { description: TERLALU_BANYAK_PERMINTAAN from this address } } }
  /passport: { get: { tags: [Talent Passport], parameters: [{ in: query, name: usaha, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Active passport and eligibility } } }, post: { tags: [Talent Passport], responses: { "201": { description: Signed passport issued; the previous one is revoked }, "409": { description: PASSPORT_BELUM_MEMENUHI } } } }
  /passport/{id}/cabut: { post: { tags: [Talent Passport], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Revoked } } } }
  /passport/verify/{kode}: { get: { tags: [Talent Passport], security: [], parameters: [{ in: path, name: kode, required: true, schema: { type: string, pattern: "^TP[0-9A-Z]{10}$" } }], responses: { "200": { description: "valid: true with the signed payload and published products, or valid: false with status tidak_valid / dicabut" }, "404": { description: Unknown code } } } }
  /klinik/poli: { get: { tags: [Klinik], security: [], responses: { "200": { description: "The six consultation desks with their editable topics; content only, no PII" } } } }
  /klinik/prefill: { get: { tags: [Klinik], responses: { "200": { description: "The signed-in visitor's own business (source sidt) and contact details; there is deliberately no NIB/NIK lookup" }, "401": { description: AUTHENTICATION_REQUIRED for anonymous visitors } } } }
  /klinik/slot: { get: { tags: [Klinik], security: [], parameters: [{ in: query, name: poli, required: true, schema: { type: integer } }, { in: query, name: tanggal, required: true, schema: { type: string, format: date } }], responses: { "200": { description: Slot availability (weekdays, tomorrow to +30 days) } } } }
  /klinik/tiket:
    post: { tags: [Klinik], security: [], requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [payload, captcha], properties: { payload: { type: string, description: "JSON form data (namaUsaha, namaKontak, whatsapp, email, poli, deskripsi, moda, tanggal, slot, consent)" }, captcha: { type: string }, lampiran: { type: array, maxItems: 3, items: { type: string, format: binary } } } } } } }, responses: { "201": { description: "Ticket number KLN-YYYY-MM-NNNN with sumberIdentitas and the outbox status of its WhatsApp message" }, "409": { description: SLOT_PENUH } } }
    get: { tags: [Klinik], parameters: [{ in: query, name: status, schema: { type: string } }], responses: { "200": { description: Tickets for the kanban (staff) } } }
  /klinik/tiket/lacak: { post: { tags: [Klinik], security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nomor, whatsapp, captcha] } } } }, responses: { "200": { description: "Ticket status for the applicant: the number AND the booking WhatsApp number must match" }, "404": { description: TIKET_TIDAK_DITEMUKAN for a mismatch or an unknown ticket } } } }
  /klinik/tiket/{id}: { patch: { tags: [Klinik], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: Updated ticket } } } }
  /klinik/statistik: { get: { tags: [Klinik], security: [], responses: { "200": { description: "Total completed consultations, mean first-response hours and CSAT (consented answers only). Empty values are null, never 0; the definitions are returned with the numbers" } } } }
  /klinik/konsultan: { get: { tags: [Klinik], security: [], parameters: [{ in: query, name: hari, schema: { type: integer, minimum: 1, maximum: 30, default: 14 } }], responses: { "200": { description: "Active konsultan directory with free slots: weekly schedule minus poli slots already booked and slots held by the linked pendamping. Allowlist fields only (no account id, no contact)" }, "400": { description: HORIZON_TIDAK_VALID } } } }
  /klinik/tiket/csat: { post: { tags: [Klinik], security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nomor, whatsapp, nilai, consent, captcha], properties: { nilai: { type: integer, minimum: 1, maximum: 5 }, consent: { type: boolean } } } } } }, responses: { "201": { description: "Rating stored (one per ticket); consent=false is stored but never averaged" }, "404": { description: TIKET_TIDAK_DITEMUKAN for a mismatch (same key as lacak) }, "409": { description: "TIKET_BELUM_SELESAI or CSAT_SUDAH_ADA" } } } }
  /klinik/tiket/{id}/outcome: { post: { tags: [Klinik], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items] } } } }, responses: { "201": { description: "Outcome submitted (status diajukan) for a completed ticket of a registered business" }, "200": { description: "Same content already submitted (duplikat: true)" }, "409": { description: "USAHA_TIDAK_TERTAUT, TIKET_BELUM_SELESAI or OUTCOME_SUDAH_ADA (use koreksi)" } } } }
  /klinik/outcome: { get: { tags: [Klinik], parameters: [{ in: query, name: status, schema: { type: string, enum: [diajukan, terverifikasi, dicabut], default: diajukan } }], responses: { "200": { description: "Verification queue for provinsi and the kab/kota that owns the business; pendamping and umkm get 403" } } } }
  /klinik/outcome/{id}/verifikasi: { post: { tags: [Klinik], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "Outcome verified; only now does it reach the profile and the IP-UMKM indicators. Retry returns duplikat: true" }, "409": { description: "VERIFIKATOR_SAMA (the submitter cannot verify) or OUTCOME_DICABUT" }, "404": { description: OUTCOME_TIDAK_DITEMUKAN (also for another kota) } } } }
  /klinik/outcome/{id}/koreksi: { post: { tags: [Klinik], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items, alasan] } } } }, responses: { "200": { description: "New verified version replaces the old one (revoked with the reason) in one transaction; retry returns duplikat: true" }, "409": { description: "OUTCOME_TIDAK_BERUBAH or OUTCOME_DICABUT" } } } }
  /klinik/outcome/{id}/cabut: { post: { tags: [Klinik], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [alasan] } } } }, responses: { "200": { description: "Outcome revoked; its effect leaves the profile and indicators immediately. Retry returns duplikat: true" } } } }
  /klinik/lampiran/{fileId}: { get: { tags: [Klinik], parameters: [{ in: path, name: fileId, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: Attachment bytes for the applicant on that ticket or for clinic staff }, "401": { description: AUTHENTICATION_REQUIRED }, "404": { description: Any other reader (the same answer as a file that does not exist) } } } }
  /klinik/notifikasi/receipt: { post: { tags: [Klinik], parameters: [{ in: header, name: x-diskuk-secret, required: true, schema: { type: string } }], responses: { "200": { description: "Receipt applied (diterapkan) and the new outbox status; only this path marks a message diterima" }, "401": { description: FORBIDDEN without the shared secret } } } }
  /kegiatan:
    get: { tags: [Kegiatan], security: [], parameters: [{ in: query, name: bulan, schema: { type: integer, minimum: 1, maximum: 12 } }, { in: query, name: tahun, schema: { type: integer } }, { in: query, name: kategori, schema: { type: string, description: "Comma list: pelatihan, sertifikasi, pameran, akselerasi, literasi_digital" } }, { in: query, name: penyelenggara, schema: { type: string, description: "Comma list; the options always include the 27 dinas kabupaten/kota" } }, { in: query, name: metode, schema: { type: string, enum: [luring, daring, hybrid] } }, { in: query, name: ramah, schema: { type: string, enum: ["1"] } }, { in: query, name: status, schema: { type: string, description: "Comma list: berjalan, pendaftaran, segera, selesai" } }], responses: { "200": { description: "Published events of the window with server-computed status, meta.kelompok counts and meta.opsi filter options" }, "400": { description: INVALID_PAYLOAD for an unknown filter value } } }
  /kegiatan/{id}: { get: { tags: [Kegiatan], security: [], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "Detail: silabus, narasumber, fasilitas, syarat skala/wilayah/NIB, official links (https only)" }, "404": { description: Draft, cancelled or unknown event } } } }
  /kegiatan/{id}/pengingat: { post: { tags: [Kegiatan], security: [], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kanal, tujuan, captcha], properties: { kanal: { type: string, enum: [email, whatsapp] }, tujuan: { type: string }, jadwalKirim: { type: string, format: date-time }, captcha: { type: string } } } } } }, responses: { "201": { description: "Opt-in stored (or updated in place) with masked target and cancellation token" }, "400": { description: CAPTCHA_INVALID or TUJUAN_TIDAK_VALID }, "404": { description: Event not published }, "409": { description: KEGIATAN_SELESAI } } } }
  /kegiatan/pengingat/batal: { post: { tags: [Kegiatan], security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, format: uuid } } } } } }, responses: { "200": { description: "Reminder cancelled (idempotent: `sudah: true` when it was cancelled before)" }, "404": { description: TOKEN_TIDAK_DITEMUKAN } } } }
  /kegiatan/pengingat/{token}: { get: { tags: [Kegiatan], security: [], parameters: [{ in: path, name: token, required: true, schema: { type: string, format: uuid } }, { in: query, name: konfirmasi, schema: { type: string, enum: ["1"] } }], responses: { "200": { description: "HTML unsubscribe page; ?konfirmasi=1 performs the cancellation" }, "404": { description: Unknown token (HTML) } } } }
  /kegiatan/pengingat/proses: { post: { tags: [Kegiatan], parameters: [{ in: header, name: x-operasional-internal-secret, required: true, schema: { type: string } }], responses: { "200": { description: "Job counters: dijadwalkan, dibatalkan, kedaluwarsa (subscriptions enqueued or cancelled) and terkirim, gagal, dilewati (outbox dispatch)" }, "403": { description: FORBIDDEN without the internal secret } } } }
  /peta/{usahaId}: { get: { tags: [Program], parameters: [{ $ref: "#/components/parameters/UsahaId" }], responses: { "200": { description: "Map pin card: owner name, scale, KBLI, turnover, valid certificates, talent status (no NIK)" } } } }
  /registrasi/prefill: { get: { tags: [Registrasi], responses: { "200": { description: "The signed-in UMKM's own business (prefill from the session owner's usaha; never a NIK/NIB oracle)" }, "401": { description: AUTHENTICATION_REQUIRED }, "403": { description: USAHA_BELUM_TERHUBUNG } } } }
  /registrasi/kegiatan/{id}/daftar: { post: { tags: [Registrasi], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [consent, captcha], properties: { butuhDisabilitas: { type: boolean }, kebutuhanAksesibilitas: { type: string, maxLength: 500 }, paktaIntegritas: { type: boolean }, consent: { type: boolean }, captcha: { type: string } } } } } }, responses: { "201": { description: "Registration created (menunggu, or daftar_tunggu when the quota is full)" }, "400": { description: "PAKTA_WAJIB / CONSENT_WAJIB / AKSESIBILITAS_WAJIB / CAPTCHA_INVALID" }, "409": { description: "PENDAFTARAN_EKSTERNAL / KEGIATAN_DIBATALKAN / PENDAFTARAN_DITUTUP / SUDAH_TERDAFTAR" }, "422": { description: TIDAK_ELIGIBLE for skala/wilayah/NIB } } } }
  /registrasi/kegiatan/{id}/saya: { get: { tags: [Registrasi], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "Own latest registration for the event" }, "404": { description: PENDAFTARAN_NOT_FOUND } } } }
  /registrasi/kegiatan/{id}/epass: { get: { tags: [Registrasi], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "E-pass QR (DISKUK-EPASS:kegiatan:pendaftaran:token), schedule and location for accepted participants" }, "404": { description: EPASS_NOT_FOUND for non-accepted } } } }
  /registrasi/kegiatan/{id}/pendaftar: { get: { tags: [Registrasi], parameters: [{ $ref: "#/components/parameters/Id" }, { in: query, name: status, schema: { type: string, enum: [menunggu, diterima, ditolak, daftar_tunggu, batal] } }], responses: { "200": { description: "Applicants for staff (provinsi; kabkota scoped to own city); no NIK" }, "403": { description: FORBIDDEN for other roles } } } }
  /registrasi/kegiatan/{id}/pendaftar/xlsx: { get: { tags: [Registrasi], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: "XLSX export of applicants (Usaha, Skala, Kota, Status, Skor Talent, Didaftarkan) without NIK" } } } }
  /registrasi/pendaftar/{pendaftaranId}/keputusan: { post: { tags: [Registrasi], parameters: [{ in: path, name: pendaftaranId, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [keputusan], properties: { keputusan: { type: string, enum: [diterima, ditolak, daftar_tunggu, batal] }, alasan: { type: string, maxLength: 2000 } } } } } }, responses: { "200": { description: "Decision applied and audited; waitlist promotion when a slot frees; WA e-pass queued only with a configured gateway" }, "409": { description: KUOTA_PENUH when accepting at a full quota } } } }
  /registrasi/pendaftar/{pendaftaranId}/tugas: { post: { tags: [Registrasi], parameters: [{ in: path, name: pendaftaranId, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [selesai], properties: { selesai: { type: boolean } } } } } }, responses: { "200": { description: "Task completion recorded for an accepted participant" } } } }
  /registrasi/pendaftar/{pendaftaranId}/sertifikat: { post: { tags: [Registrasi], parameters: [{ in: path, name: pendaftaranId, required: true, schema: { type: string, format: uuid } }], responses: { "201": { description: "Signed e-certificate issued; both IP-UMKM impact indicators upserted atomically" }, "200": { description: "Existing active certificate returned unchanged (idempotent)" }, "409": { description: BELUM_LAYAK below 80% attendance or without the task } } } }
  /registrasi/sertifikat/{sertifikatId}/cabut: { post: { tags: [Registrasi], parameters: [{ in: path, name: sertifikatId, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: "Certificate revoked; the impact rows are deactivated (aktif = FALSE)" }, "404": { description: SERTIFIKAT_NOT_FOUND for a non-active certificate } } } }
  /registrasi/sertifikat/{kode}: { get: { tags: [Registrasi], security: [], parameters: [{ in: path, name: kode, required: true, schema: { type: string, pattern: "^SK[A-Z2-9]{10}$" } }], responses: { "200": { description: "Public verification: valid (payload_hash + Ed25519 re-check), dicabut, or tidak_valid" }, "404": { description: Unknown code } } } }
  /registrasi/pindai: { post: { tags: [Registrasi], security: [], parameters: [{ in: header, name: x-operasional-internal-secret, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [qr, sesiKe], properties: { qr: { type: string }, sesiKe: { type: integer, minimum: 1, maximum: 60 } } } } } }, responses: { "200": { description: "Attendance upserted idempotently per (pendaftaran, sesi); hadir/persen returned" }, "400": { description: "QR_TIDAK_VALID / SESI_TIDAK_VALID" }, "403": { description: FORBIDDEN without the internal secret }, "404": { description: QR_TIDAK_DITEMUKAN for another participant's code } } } }
  /fasilitasi: { get: { tags: [Fasilitasi], security: [], parameters: [{ in: query, name: bentuk, schema: { type: string, enum: [penghargaan, beasiswa, operasional, sarpras_produksi, sarpras_pemasaran, revitalisasi_gedung, permodalan, lainnya] } }, { in: query, name: jenis, schema: { type: string, enum: [uang, barang, jasa] } }], responses: { "200": { description: "Eight published facilitation cards with sisaKuota, serverNow countdown status (dibuka/segera/ditutup/penuh) and official CTA (petunjuk/kanalResmi; no fake forms)" }, "400": { description: INVALID_PAYLOAD filter } } } }
  /fasilitasi/{id}/terisi: { patch: { tags: [Fasilitasi], parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [terisi], properties: { terisi: { type: integer, minimum: 0 } } } } } }, responses: { "200": { description: "Filled-quota counter curated by provincial staff (never above kuota)" }, "400": { description: "INVALID_PAYLOAD / TERISI_MELEBIHI_KUOTA" }, "404": { description: BANTUAN_NOT_FOUND } } } }
